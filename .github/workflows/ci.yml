name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/usedcontract
      - run: node agents/node/test.mjs
      - run: cd agents/python && python -m unittest -v
      - run: cd agents/jvm && mkdir -p out && javac -d out src/main/java/io/usedcontract/Agent.java
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet build agents/dotnet/UsedContract/UsedContract.csproj --configuration Release

# Automatic-adapter tests are also executed by the repository verification script.
